<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Youth Hub - CGPA Calculator</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #222;
}

.container {
    width: 94%;
    max-width: 1000px;
    margin: 30px auto;
}

.back {
    display: inline-block;
    padding: 10px 15px;
    background: white;
    border-radius: 10px;
    text-decoration: none;
    color: #222;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.description {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}


/* Grade information */

.grade-info {
    background: #f1f3f6;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 25px;
    line-height: 1.8;
    text-align: center;
}

.grade-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
}

.grade-table th,
.grade-table td {
    padding: 8px;
    border: 1px solid #ddd;
    text-align: center;
}


/* Subject rows */

.subject-row {

    display: grid;

    grid-template-columns:
        2fr 1fr 1fr auto;

    gap: 10px;

    margin-bottom: 12px;

    align-items: center;
}

input,
select {

    width: 100%;

    padding: 13px;

    border: 1px solid #ccc;

    border-radius: 9px;

    font-size: 15px;

}

.points {

    background: #f1f3f6;

    text-align: center;

    padding: 13px;

    border-radius: 9px;

    font-weight: bold;

}

.delete-btn {

    padding: 12px 15px;

    border: none;

    border-radius: 9px;

    cursor: pointer;

    font-size: 16px;

}


/* Buttons */

.buttons {

    display: flex;

    gap: 10px;

    margin-top: 20px;

}

.buttons button {

    flex: 1;

    padding: 14px;

    border: none;

    border-radius: 10px;

    font-size: 16px;

    cursor: pointer;

}


/* Result */

.result {

    margin-top: 25px;

    padding: 22px;

    background: #f1f3f6;

    border-radius: 15px;

    line-height: 1.9;

}

.cgpa {

    font-size: 42px;

    font-weight: bold;

    text-align: center;

    margin: 10px 0 20px;

}


/* Calculation table */

.breakdown {

    width: 100%;

    border-collapse: collapse;

    margin-top: 20px;

}

.breakdown th,
.breakdown td {

    padding: 10px;

    border-bottom: 1px solid #ddd;

    text-align: center;

}


/* Mobile */

@media (max-width: 700px) {

    .subject-row {

        grid-template-columns: 1fr 1fr;

    }

    .subject-row input:first-child {

        grid-column: span 2;

    }

    .buttons {

        flex-direction: column;

    }

}

</style>

</head>


<body>


<div class="container">


<a class="back" href="tools.html">

← Tools

</a>


<div class="card">


<h1>🎯 CGPA Calculator</h1>


<p class="description">

Calculate CGPA using Grade Points and Subject Credits

</p>


<!-- Grade System -->

<div class="grade-info">

<b>Our Grade System</b>


<table class="grade-table">

<tr>

<th>Grade</th>
<th>Grade Point</th>

</tr>

<tr>

<td>S</td>
<td>10</td>

</tr>

<tr>

<td>A</td>
<td>9</td>

</tr>

<tr>

<td>B</td>
<td>8</td>

</tr>

<tr>

<td>C</td>
<td>7</td>

</tr>

<tr>

<td>D</td>
<td>6</td>

</tr>

<tr>

<td>E</td>
<td>5</td>

</tr>

<tr>

<td>F</td>
<td>0</td>

</tr>

</table>


<br>

<b>Formula:</b>

<br>

CGPA =
Σ(Grade Point × Credit)
÷
Σ(Credits)

</div>


<!-- Subjects -->

<div id="subjects"></div>


<!-- Buttons -->

<div class="buttons">


<button onclick="addSubject()">

➕ Add Subject

</button>


<button onclick="calculateCGPA()">

🎯 Calculate CGPA

</button>


<button onclick="resetCalculator()">

🔄 Reset

</button>


</div>


<!-- Result -->

<div class="result" id="result">

Add subjects, select grades and enter credits.

</div>


</div>


</div>


<script>


/* =========================
   GRADE POINT SYSTEM
========================= */


const gradePoints = {

    "S": 10,

    "A": 9,

    "B": 8,

    "C": 7,

    "D": 6,

    "E": 5,

    "F": 0

};


/* Subject counter */

let subjectCount = 0;


/* =========================
   ADD SUBJECT
========================= */


function addSubject() {


    subjectCount++;


    const container =
        document.getElementById("subjects");


    const row =
        document.createElement("div");


    row.className =
        "subject-row";


    row.id =
        "subject-" + subjectCount;


    row.innerHTML = `

        <input
            type="text"
            placeholder="Subject name">


        <select
            onchange="updateGradePoint(this)">

            <option value="">
                Select Grade
            </option>

            <option value="S">
                S
            </option>

            <option value="A">
                A
            </option>

            <option value="B">
                B
            </option>

            <option value="C">
                C
            </option>

            <option value="D">
                D
            </option>

            <option value="E">
                E
            </option>

            <option value="F">
                F
            </option>

        </select>


        <div class="points">

            GP:
            <span>—</span>

        </div>


        <input
            type="number"
            min="0"
            step="0.5"
            placeholder="Credits">


        <button
            class="delete-btn"
            onclick="deleteSubject(${subjectCount})">

            🗑️

        </button>

    `;


    container.appendChild(row);

}


/* =========================
   UPDATE GRADE POINT
========================= */


function updateGradePoint(select) {


    const grade =
        select.value;


    const row =
        select.parentElement;


    const point =
        row.querySelector(
            ".points span"
        );


    if (grade === "") {

        point.textContent = "—";

        return;

    }


    point.textContent =
        gradePoints[grade];

}


/* =========================
   DELETE SUBJECT
========================= */


function deleteSubject(id) {


    const row =
        document.getElementById(
            "subject-" + id
        );


    if (row) {

        row.remove();

    }

}


/* =========================
   CALCULATE CGPA
========================= */


function calculateCGPA() {


    const rows =
        document.querySelectorAll(
            ".subject-row"
        );


    if (rows.length === 0) {

        document.getElementById("result").innerHTML =

            "⚠️ Please add at least one subject.";

        return;

    }


    let totalCredits = 0;

    let totalCreditPoints = 0;

    let breakdown = "";


    rows.forEach(
        (row, index) => {


        const inputs =
            row.querySelectorAll(
                "input"
            );


        const select =
            row.querySelector(
                "select"
            );


        const subject =
            inputs[0].value.trim()
            ||
            "Subject " + (index + 1);


        const credits =
            Number(inputs[1].value);


        const grade =
            select.value;


        /* Validate */

        if (!grade) {

            return;

        }


        if (
            credits <= 0 ||
            isNaN(credits)
        ) {

            return;

        }


        /* Grade Point */

        const gradePoint =
            gradePoints[grade];


        /* Credit Points */

        const creditPoints =
            gradePoint * credits;


        /* Totals */

        totalCredits +=
            credits;


        totalCreditPoints +=
            creditPoints;


        /* Breakdown */

        breakdown += `

        <tr>

            <td>
                ${subject}
            </td>

            <td>
                ${grade}
            </td>

            <td>
                ${gradePoint}
            </td>

            <td>
                ${credits}
            </td>

            <td>
                ${creditPoints.toFixed(2)}
            </td>

        </tr>

        `;


    });


    /* No valid subjects */

    if (totalCredits === 0) {

        document.getElementById("result").innerHTML =

            "⚠️ Please select grades and enter credits.";

        return;

    }


    /* CGPA */

    const cgpa =
        totalCreditPoints /
        totalCredits;


    /* Result */

    document.getElementById("result").innerHTML = `

        <h2 style="text-align:center;">

            🎯 Your CGPA

        </h2>


        <div class="cgpa">

            ${cgpa.toFixed(2)}

        </div>


        <p>

            <b>Total Credits:</b>

            ${totalCredits.toFixed(2)}

        </p>


        <p>

            <b>Total Credit Points:</b>

            ${totalCreditPoints.toFixed(2)}

        </p>


        <p>

            <b>Calculation:</b>

            ${totalCreditPoints.toFixed(2)}

            ÷

            ${totalCredits.toFixed(2)}

            =

            ${cgpa.toFixed(2)}

        </p>


        <table class="breakdown">

            <thead>

                <tr>

                    <th>
                        Subject
                    </th>

                    <th>
                        Grade
                    </th>

                    <th>
                        GP
                    </th>

                    <th>
                        Credit
                    </th>

                    <th>
                        GP × Credit
                    </th>

                </tr>

            </thead>


            <tbody>

                ${breakdown}

            </tbody>

        </table>

    `;

}


/* =========================
   RESET
========================= */


function resetCalculator() {


    document.getElementById(
        "subjects"
    ).innerHTML = "";


    document.getElementById(
        "result"
    ).innerHTML =

        "Add subjects, select grades and enter credits.";


    subjectCount = 0;


    addSubject();

    addSubject();

    addSubject();

}


/* =========================
   INITIAL SUBJECTS
========================= */


addSubject();

addSubject();

addSubject();


</script>


</body>

</html>
