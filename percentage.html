<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Youth Hub - Percentage</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
        }

        .back {
            display: inline-block;
            padding: 10px 15px;
            background: white;
            border-radius: 10px;
            text-decoration: none;
            color: #222;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .box {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 8px;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f1f3f6;
            border-radius: 12px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="container">

    <a class="back" href="tools.html">
        ← Tools
    </a>

    <div class="card">

        <h1>📊 Percentage Calculator</h1>

        <div class="box">
            <label>Percentage (%)</label>

            <input
                type="number"
                id="percent"
                placeholder="Example: 20">
        </div>

        <div class="box">
            <label>Number</label>

            <input
                type="number"
                id="number"
                placeholder="Example: 500">
        </div>

        <button onclick="calculatePercentage()">
            Calculate
        </button>

        <div class="result" id="result">
            Enter values to calculate.
        </div>

    </div>

</div>


<script>

function calculatePercentage() {

    let percentage =
        Number(document.getElementById("percent").value);

    let number =
        Number(document.getElementById("number").value);

    if (!percentage || !number) {

        document.getElementById("result").innerHTML =
            "⚠️ Please enter both values.";

        return;
    }

    let answer =
        (percentage / 100) * number;

    document.getElementById("result").innerHTML =

        `<b>Formula:</b><br>
        (${percentage} ÷ 100) × ${number}

        <br><br>

        <b>Answer:</b><br>
        ${answer}`;

}

</script>

</body>
</html>
