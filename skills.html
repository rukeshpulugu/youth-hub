<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Youth Hub - Skills Hub</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family: Arial, sans-serif;

    background: #f5f7fb;

    color: #222;

}

.container {

    width: 92%;

    max-width: 1100px;

    margin: 30px auto;

}


/* HEADER */

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;

}

.logo {

    font-size: 30px;

    font-weight: bold;

}

.home {

    text-decoration: none;

    color: #222;

    background: white;

    padding: 10px 15px;

    border-radius: 10px;

}


/* HERO */

.hero {

    background: white;

    padding: 30px;

    border-radius: 20px;

    margin-bottom: 25px;

    box-shadow:
        0 5px 18px rgba(0,0,0,0.07);

}

.hero h1 {

    font-size: 32px;

    margin-bottom: 10px;

}

.hero p {

    color: #666;

    line-height: 1.6;

}


/* SKILLS */

.skills {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;

}

.skill {

    background: white;

    border: none;

    border-radius: 18px;

    padding: 25px;

    min-height: 220px;

    text-align: left;

    cursor: pointer;

    box-shadow:
        0 5px 18px rgba(0,0,0,0.07);

    transition: 0.2s;

}

.skill:hover {

    transform:
        translateY(-6px);

}

.icon {

    font-size: 45px;

    margin-bottom: 15px;

}

.skill h2 {

    margin-bottom: 8px;

}

.skill p {

    color: #666;

    line-height: 1.5;

}

.badge {

    display: inline-block;

    margin-top: 15px;

    padding: 6px 10px;

    background: #f1f3f6;

    border-radius: 8px;

    font-size: 12px;

}


/* MOBILE */

@media(max-width:800px) {

    .skills {

        grid-template-columns:
            repeat(2, 1fr);

    }

}

@media(max-width:500px) {

    .header {

        flex-direction: column;

        align-items: flex-start;

        gap: 12px;

    }

    .skills {

        grid-template-columns: 1fr;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- HEADER -->

<div class="header">

    <div class="logo">

        🎓 Youth Hub Skills

    </div>


    <a
        class="home"
        href="../index.html">

        🏠 Home

    </a>

</div>



<!-- HERO -->

<div class="hero">

    <h1>

        Learn Skills. Build Your Future. 🚀

    </h1>


    <p>

        Free interactive tools to improve
        your technical, communication and
        career skills.

    </p>

</div>



<!-- SKILL CARDS -->

<div class="skills">


    <!-- CODING -->

    <button
        class="skill"
        onclick="openSkill('coding')">


        <div class="icon">

            💻

        </div>


        <h2>

            Coding Practice

        </h2>


        <p>

            Practice programming concepts,
            logic and coding challenges.

        </p>


        <span class="badge">

            💻 Programming

        </span>


    </button>



    <!-- TYPING -->

    <button
        class="skill"
        onclick="openSkill('typing')">


        <div class="icon">

            ⌨️

        </div>


        <h2>

            Typing Test

        </h2>


        <p>

            Improve your typing speed,
            accuracy and consistency.

        </p>


        <span class="badge">

            ⚡ Speed

        </span>


    </button>



    <!-- ENGLISH -->

    <button
        class="skill"
        onclick="openSkill('english')">


        <div class="icon">

            🗣️

        </div>


        <h2>

            English Practice

        </h2>


        <p>

            Improve grammar, vocabulary,
            speaking and communication.

        </p>


        <span class="badge">

            🗣️ Communication

        </span>


    </button>



    <!-- INTERVIEW -->

    <button
        class="skill"
        onclick="openSkill('interview')">


        <div class="icon">

            🎤

        </div>


        <h2>

            Interview Practice

        </h2>


        <p>

            Practice common interview
            questions and answers.

        </p>


        <span class="badge">

            💼 Career

        </span>


    </button>



    <!-- RESUME -->

    <button
        class="skill"
        onclick="openSkill('resume')">


        <div class="icon">

            📄

        </div>


        <h2>

            Resume Builder

        </h2>


        <p>

            Create a professional resume
            using a simple guided builder.

        </p>


        <span class="badge">

            📄 Career

        </span>


    </button>



    <!-- COMMUNICATION -->

    <button
        class="skill"
        onclick="openSkill('communication')">


        <div class="icon">

            🎯

        </div>


        <h2>

            Communication

        </h2>


        <p>

            Practice public speaking,
            presentations and confidence.

        </p>


        <span class="badge">

            🚀 Personal Growth

        </span>


    </button>



</div>


</div>



<script>


function openSkill(skill) {


    const pages = {

        coding:
            "coding.html",

        typing:
            "typing.html",

        english:
            "english.html",

        interview:
            "interview.html",

        resume:
            "resume.html",

        communication:
            "communication.html"

    };


    if (pages[skill]) {

        window.location.href =
            pages[skill];

    }

}

</script>


</body>

</html>
