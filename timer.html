<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Youth Hub - Timer</title>

<style>

body {
font-family:Arial,sans-serif;
background:#f5f7fb;
}

.container {
width:90%;
max-width:500px;
margin:60px auto;
}

.back {
display:inline-block;
padding:10px 15px;
background:white;
border-radius:10px;
text-decoration:none;
color:#222;
margin-bottom:20px;
}

.card {
background:white;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

h1 {
margin-bottom:20px;
}

#display {
font-size:50px;
margin:25px 0;
}

input {
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:10px;
font-size:18px;
}

button {
padding:14px 20px;
margin:5px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<a class="back" href="tools.html">
← Tools
</a>

<div class="card">

<h1>⏰ Timer</h1>

<input
type="number"
id="minutes"
placeholder="Enter minutes">

<div id="display">
00:00
</div>

<button onclick="startTimer()">
▶ Start
</button>

<button onclick="pauseTimer()">
⏸ Pause
</button>

<button onclick="resetTimer()">
🔄 Reset
</button>

</div>

</div>

<script>

let timeLeft = 0;
let timer = null;

function startTimer() {

if(timer) return;

if(timeLeft === 0){

let minutes =
Number(
document.getElementById("minutes").value
);

if(minutes <= 0){

alert("Enter minutes first.");

return;

}

timeLeft = minutes * 60;

}

updateDisplay();

timer =
setInterval(function(){

timeLeft--;

updateDisplay();

if(timeLeft <= 0){

clearInterval(timer);

timer = null;

alert("⏰ Time's up!");

}

},1000);

}

function pauseTimer(){

clearInterval(timer);

timer = null;

}

function resetTimer(){

clearInterval(timer);

timer = null;

timeLeft = 0;

document.getElementById("minutes").value = "";

updateDisplay();

}

function updateDisplay(){

let minutes =
Math.floor(timeLeft / 60);

let seconds =
timeLeft % 60;

document.getElementById("display").innerText =

String(minutes).padStart(2,"0") +

":" +

String(seconds).padStart(2,"0");

}

</script>

</body>

</html>
