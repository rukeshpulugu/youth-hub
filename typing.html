<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Youth Hub - Typing Test</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family: Arial, sans-serif;

    background: #f5f7fb;

    color: #222;

}

.container {

    width: 92%;

    max-width: 850px;

    margin: 30px auto;

}


/* HEADER */

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;

}

.header h1 {

    font-size: 30px;

}

.back {

    text-decoration: none;

    color: #222;

    background: white;

    padding: 10px 15px;

    border-radius: 10px;

}


/* SETUP */

.setup {

    background: white;

    padding: 30px;

    border-radius: 20px;

    box-shadow:
        0 5px 18px rgba(0,0,0,0.07);

    text-align: center;

}

.setup h2 {

    margin-bottom: 20px;

}

.modes {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

}

.mode {

    border: none;

    background: #f1f3f6;

    padding: 20px;

    border-radius: 12px;

    cursor: pointer;

    font-size: 16px;

}


/* TEST */

.test {

    display: none;

}


/* STATS */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;

    margin-bottom: 20px;

}

.stat {

    background: white;

    padding: 15px;

    border-radius: 12px;

    text-align: center;

}

.number {

    font-size: 25px;

    font-weight: bold;

}

.label {

    color: #777;

    font-size: 13px;

    margin-top: 4px;

}


/* TEXT */

.text-box {

    background: white;

    padding: 25px;

    border-radius: 18px;

    box-shadow:
        0 5px 18px rgba(0,0,0,0.07);

    margin-bottom: 15px;

}

.text {

    font-size: 20px;

    line-height: 1.8;

    color: #555;

    user-select: none;

}


/* INPUT */

.typing-input {

    width: 100%;

    height: 150px;

    resize: none;

    padding: 18px;

    font-size: 18px;

    line-height: 1.6;

    border: 1px solid #ccc;

    border-radius: 15px;

    outline: none;

}

.typing-input:focus {

    border-color: #555;

}


/* CONTROLS */

.controls {

    display: flex;

    gap: 10px;

    margin-top: 15px;

}

button {

    border: none;

    padding: 13px 20px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 15px;

}


/* RESULT */

.result {

    display: none;

    background: white;

    padding: 30px;

    border-radius: 20px;

    box-shadow:
        0 5px 18px rgba(0,0,0,0.07);

    text-align: center;

}

.result h2 {

    margin-bottom: 20px;

}

.result-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;

    margin-bottom: 20px;

}

.result-card {

    background: #f1f3f6;

    padding: 20px;

    border-radius: 12px;

}

.result-number {

    font-size: 30px;

    font-weight: bold;

}


/* MOBILE */

@media(max-width:650px) {

    .header {

        flex-direction: column;

        align-items: flex-start;

        gap: 12px;

    }

    .modes {

        grid-template-columns: 1fr;

    }

    .stats {

        grid-template-columns:
            repeat(2, 1fr);

    }

    .text {

        font-size: 17px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- HEADER -->

<div class="header">

    <h1>⌨️ Typing Test</h1>

    <a
        class="back"
        href="skills.html">

        ← Skills

    </a>

</div>



<!-- SETUP -->

<div
    class="setup"
    id="setup">


    <h2>

        Choose Test Duration

    </h2>


    <div class="modes">


        <button
            class="mode"
            onclick="startTest(30)">

            ⚡ 30 Seconds

        </button>


        <button
            class="mode"
            onclick="startTest(60)">

            🚀 60 Seconds

        </button>


        <button
            class="mode"
            onclick="startTest(120)">

            🏆 2 Minutes

        </button>


    </div>

</div>



<!-- TEST -->

<div
    class="test"
    id="test">


    <!-- STATS -->

    <div class="stats">


        <div class="stat">

            <div
                class="number"
                id="time">

                30

            </div>

            <div class="label">

                Seconds

            </div>

        </div>


        <div class="stat">

            <div
                class="number"
                id="wpm">

                0

            </div>

            <div class="label">

                WPM

            </div>

        </div>


        <div class="stat">

            <div
                class="number"
                id="accuracy">

                100%

            </div>

            <div class="label">

                Accuracy

            </div>

        </div>


        <div class="stat">

            <div
                class="number"
                id="errors">

                0

            </div>

            <div class="label">

                Errors

            </div>

        </div>


    </div>



    <!-- TEXT -->

    <div class="text-box">

        <div
            class="text"
            id="text">

        </div>

    </div>



    <!-- INPUT -->

    <textarea
        class="typing-input"
        id="input"
        placeholder="Start typing here..."
        spellcheck="false"
        disabled>
    </textarea>


    <div class="controls">

        <button
            onclick="restartTest()">

            🔄 Restart

        </button>

    </div>


</div>



<!-- RESULT -->

<div
    class="result"
    id="result">


    <h2>

        🎉 Test Complete!

    </h2>


    <div class="result-grid">


        <div class="result-card">

            <div
                class="result-number"
                id="finalWpm">

                0

            </div>

            <div>

                WPM

            </div>

        </div>


        <div class="result-card">

            <div
                class="result-number"
                id="finalAccuracy">

                0%

            </div>

            <div>

                Accuracy

            </div>

        </div>


        <div class="result-card">

            <div
                class="result-number"
                id="finalCorrect">

                0

            </div>

            <div>

                Correct Characters

            </div>

        </div>


        <div class="result-card">

            <div
                class="result-number"
                id="finalErrors">

                0

            </div>

            <div>

                Errors

            </div>

        </div>


    </div>


    <p id="bestMessage"></p>


    <br>


    <button
        onclick="goAgain()">

        🔄 Try Again

    </button>


</div>


</div>



<script>


/* =========================
   TEXTS
========================= */


const texts = [

    "Learning new skills every day can help students build confidence and create better opportunities for the future.",

    "Technology is changing the world quickly, and young people can use digital skills to solve problems and create useful products.",

    "Practice makes progress. When you learn consistently and improve a little every day, difficult skills become easier over time.",

    "Good communication is an important skill for students because it helps them express ideas clearly and work effectively with others.",

    "Programming teaches logical thinking and problem solving. Building small projects is a great way to become a better developer."

];


let duration = 30;

let timeLeft = 30;

let timer = null;

let started = false;

let currentText = "";

let correctChars = 0;

let totalChars = 0;

let errors = 0;


/* =========================
   START
========================= */


function startTest(seconds) {


    duration = seconds;

    timeLeft = seconds;

    started = false;

    correctChars = 0;

    totalChars = 0;

    errors = 0;


    clearInterval(timer);


    document
    .getElementById("setup")
    .style.display =
        "none";


    document
    .getElementById("result")
    .style.display =
        "none";


    document
    .getElementById("test")
    .style.display =
        "block";


    currentText =

        texts[
            Math.floor(
                Math.random() *
                texts.length
            )
        ];


    document
    .getElementById("text")
    .innerText =
        currentText;


    const input =
        document.getElementById(
            "input"
        );


    input.value = "";

    input.disabled = false;

    input.focus();


    document
    .getElementById("time")
    .innerText =
        timeLeft;


    document
    .getElementById("wpm")
    .innerText =
        "0";


    document
    .getElementById("accuracy")
    .innerText =
        "100%";


    document
    .getElementById("errors")
    .innerText =
        "0";


    input.oninput =
        handleTyping;

}


/* =========================
   TYPING
========================= */


function handleTyping(event) {


    if (!started) {

        started = true;

        startTimer();

    }


    const typed =
        event.target.value;


    totalChars =
        typed.length;


    correctChars = 0;

    errors = 0;


    for (
        let i = 0;
        i < typed.length;
        i++
    ) {

        if (
            typed[i] ===
            currentText[i]
        ) {

            correctChars++;

        }

        else {

            errors++;

        }

    }


    updateStats();


    if (
        typed.length >=
        currentText.length
    ) {

        finishTest();

    }

}


/* =========================
   TIMER
========================= */


function startTimer() {


    timer = setInterval(
        () => {


            timeLeft--;


            document
            .getElementById("time")
            .innerText =
                timeLeft;


            updateStats();


            if (
                timeLeft <= 0
            ) {

                finishTest();

            }


        },
        1000
    );

}


/* =========================
   STATS
========================= */


function updateStats() {


    const elapsed =
        duration -
        timeLeft;


    if (
        elapsed <= 0
    ) {

        return;

    }


    const minutes =
        elapsed / 60;


    const wpm =

        Math.round(

            (
                correctChars / 5
            )
            /
            minutes

        );


    const accuracy =

        totalChars === 0

        ?

        100

        :

        Math.round(

            (
                correctChars /
                totalChars
            ) * 100

        );


    document
    .getElementById("wpm")
    .innerText =
        wpm;


    document
    .getElementById("accuracy")
    .innerText =
        accuracy + "%";


    document
    .getElementById("errors")
    .innerText =
        errors;

}


/* =========================
   FINISH
========================= */


function finishTest() {


    clearInterval(timer);


    const input =
        document.getElementById(
            "input"
        );


    input.disabled = true;


    const elapsed =

        Math.max(
            duration - timeLeft,
            1
        );


    const minutes =
        elapsed / 60;


    const wpm =

        Math.round(

            (
                correctChars / 5
            )
            /
            minutes

        );


    const accuracy =

        totalChars === 0

        ?

        100

        :

        Math.round(

            (
                correctChars /
                totalChars
            ) * 100

        );


    document
    .getElementById("test")
    .style.display =
        "none";


    document
    .getElementById("result")
    .style.display =
        "block";


    document
    .getElementById("finalWpm")
    .innerText =
        wpm;


    document
    .getElementById("finalAccuracy")
    .innerText =
        accuracy + "%";


    document
    .getElementById("finalCorrect")
    .innerText =
        correctChars;


    document
    .getElementById("finalErrors")
    .innerText =
        errors;


    saveTypingBest(wpm);

}


/* =========================
   BEST SCORE
========================= */


function saveTypingBest(wpm) {


    const best =
        Number(
            localStorage.getItem(
                "youthHubTypingBest"
            )
        ) || 0;


    if (wpm > best) {

        localStorage.setItem(
            "youthHubTypingBest",
            wpm
        );


        document
        .getElementById(
            "bestMessage"
        )
        .innerText =

            "🏆 New Personal Best!";

    }

    else {

        document
        .getElementById(
            "bestMessage"
        )
        .innerText =

            "🏆 Personal Best: "
            +
            best
            +
            " WPM";

    }

}


/* =========================
   RESTART
========================= */


function restartTest() {

    clearInterval(timer);

    startTest(duration);

}


/* =========================
   TRY AGAIN
========================= */


function goAgain() {

    document
    .getElementById("result")
    .style.display =
        "none";


    document
    .getElementById("setup")
    .style.display =
        "block";

}


</script>


</body>

</html>
