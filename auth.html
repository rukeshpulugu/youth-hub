<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Youth Hub - Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8f4ff, #f8fbff);
        }

        .auth-container {
            width: 390px;
            padding: 35px;
            background: white;
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .logo {
            font-size: 42px;
            margin-bottom: 8px;
        }

        h1 {
            color: #172554;
            font-size: 30px;
            margin-bottom: 6px;
        }

        .tagline {
            color: #64748b;
            margin-bottom: 28px;
        }

        h2 {
            color: #1e293b;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 14px;
            border: 1px solid #dbe3ef;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .login-text {
            margin-top: 18px;
            color: #64748b;
            font-size: 14px;
        }

        .login-text a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .developer {
            margin-top: 28px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <div class="logo">🚀</div>

        <h1>YOUTH HUB</h1>

        <p class="tagline">
            Learn • Create • Connect • Grow
        </p>

        <h2>Create your account</h2>

        <form id="signupForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Sign Up
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <p class="developer">
            Developed by Rukesh
        </p>

    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("signupForm").addEventListener("submit", function(event) {
                event.preventDefault();

                const name = document.getElementById("name").value;

                localStorage.setItem("youthHubUser", name);

                window.location.href = "index.html";
            });
        });
    </script>

</body>
</html>
